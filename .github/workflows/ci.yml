name: Code quality
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject committed Vercel build output
        run: |
          if [ -n "$(git ls-files -- .vercel/output)" ]; then
            echo "::error::Do not commit .vercel/output: Vercel deploys these artifacts instead of building the current source."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run validate
